<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasty Bites - Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">🍔 Tasty Bites</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <div class="section">
    <h2>Contact Us</h2>

    <form id="contact-form" onsubmit="return checkForm()">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Enter your name">

      <label for="email">Email</label>
      <input type="text" id="email" placeholder="Enter your email">

      <label for="message">Message</label>
      <textarea id="message" rows="5" placeholder="Write your message here"></textarea>

      <button type="submit" class="btn">Send Message</button>
      <p id="msg"></p>
    </form>

    <div class="about-text" style="max-width:500px; margin:25px auto;">
      <p>📍 Sohna Road, Gurgaon, Haryana</p>
      <p>📞 +91 98765 43210</p>
      <p>✉️ tastybites@example.com</p>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Tasty Bites | Made by [Your Name], BCA 1st Year, Mangalam University</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
