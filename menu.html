<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasty Bites - Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">🍔 Tasty Bites</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html" class="active">Menu</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <span id="cart-box">🛒 Cart: <span id="cart-count">0</span></span>
    </nav>
  </header>

  <div class="section">
    <h2>Our Menu</h2>
    <div class="cards">

      <div class="card">
        <div class="emoji">🍕</div>
        <h3>Cheese Pizza</h3>
        <p class="price">₹199</p>
        <button onclick="addToCart('Cheese Pizza')">Add to Cart</button>
      </div>

      <div class="card">
        <div class="emoji">🍔</div>
        <h3>Veg Burger</h3>
        <p class="price">₹99</p>
        <button onclick="addToCart('Veg Burger')">Add to Cart</button>
      </div>

      <div class="card">
        <div class="emoji">🍝</div>
        <h3>White Sauce Pasta</h3>
        <p class="price">₹149</p>
        <button onclick="addToCart('White Sauce Pasta')">Add to Cart</button>
      </div>

      <div class="card">
        <div class="emoji">🌯</div>
        <h3>Paneer Roll</h3>
        <p class="price">₹89</p>
        <button onclick="addToCart('Paneer Roll')">Add to Cart</button>
      </div>

      <div class="card">
        <div class="emoji">🍟</div>
        <h3>French Fries</h3>
        <p class="price">₹79</p>
        <button onclick="addToCart('French Fries')">Add to Cart</button>
      </div>

      <div class="card">
        <div class="emoji">🥤</div>
        <h3>Cold Coffee</h3>
        <p class="price">₹69</p>
        <button onclick="addToCart('Cold Coffee')">Add to Cart</button>
      </div>

    </div>
  </div>

  <footer>
    <p>&copy; 2026 Tasty Bites | Made by [Your Name], BCA 1st Year, Mangalam University</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
